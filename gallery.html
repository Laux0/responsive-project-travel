<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <meta
      name="description"
      content="Photo gallery for travel photographer, Laura Rahamti, featuring photos from recent trips to Thailand, Slovenia and Germany."
    />
    <title>Photo gallery for travel photographer Laura Rahmati</title>
    <link rel="stylesheet" href="/style/style.css" />
  </head>
  <body>
    <div class="navigation">
      <nav class="d-none d-sm-block d-flex justify-content-between">
        <i class="fa-solid fa-earth-europe fa-2xl mt-3"></i>
        <ul>
          <li><a href="/" title="Link to homepage">Home</a></li>
          <li><a href="/about.html" title="Link to about page">About</a></li>
          <li>
            <a href="/gallery.html" class="active" title="Link to gallery page"
              >Gallery</a
            >
          </li>
          <li>
            <a href="/contact.html" title="Link to contact page">Contact</a>
          </li>
        </ul>
      </nav>
    </div>
    <div class="introduction">
      <h1>Photo Gallery</h1>
    </div>
    <div class="gallery-content">
      <div class="row">
        <div class="col-12">
          <h2 class="mb-3">Thailand</h2>
        </div>
      </div>
      <div class="row">
        <div class="col-sm-4">
          <img
            src="/images/Thailand1.png"
            class="img-fluid gallery-image"
            alt="Picture of Erawan museum in Thailand"
          />
        </div>
        <div class="col-sm-4">
          <img
            src="/images/Thailand2.png"
            class="img-fluid gallery-image"
            alt="Picture of Lumphini park in Thailand at night"
          />
        </div>
        <div class="col-sm-4">
          <img
            src="/images/Thailand3.png"
            class="img-fluid gallery-image"
            alt="Picture of Benchakitti park in Thailand at sunset"
          />
        </div>
      </div>
      <div class="row">
        <div class="col-12">
          <h2 class="mb-3">Slovenia</h2>
        </div>
      </div>
      <div class="row">
        <div class="col-sm-4">
          <img
            src="/images/Slovenia1.png"
            class="img-fluid gallery-image"
            alt="Picture of Postojna caves in Slovenia"
          />
        </div>
        <div class="col-sm-4">
          <img
            src="/images/Slovenia2.png"
            class="img-fluid gallery-image"
            alt="Picture of Lake Bled in Slovenia"
          />
        </div>
        <div class="col-sm-4">
          <img
            src="/images/Slovenia3.png"
            class="img-fluid gallery-image"
            alt="Picture of a dragon statue in Ljubljana, Slovenia"
          />
        </div>
      </div>
      <div class="row">
        <div class="col-12">
          <h2 class="mb-3">Germany</h2>
        </div>
      </div>
      <div class="row">
        <div class="col-sm-4">
          <img
            src="/images/Germany1.png"
            class="img-fluid gallery-image"
            alt="Picture of a beach on Usedom in Germany"
          />
        </div>
        <div class="col-sm-4">
          <img
            src="/images/Germany2.png"
            class="img-fluid gallery-image"
            alt="Picture of Wernigerode castle in Germany"
          />
        </div>
        <div class="col-sm-4">
          <img
            src="/images/Germany3.png"
            class="img-fluid gallery-image"
            alt="Picture of the Drachenschlucht hike in Germany"
          />
        </div>
      </div>
    </div>
    <footer>
      <div class="navigation">
        <div class="row">
          <div class="col-12">
            <p>Contact me at:</p>
            <a
              href="mailto:laura.rahmati@gmail.com"
              class="email-link"
              title="Link to contact per email"
              ><strong>laura.rahmati@gmail.com</strong></a
            >
          </div>
        </div>
        <br />
        <div class="row">
          <div class="col-4">
            <a
              href="mailto:laura.rahmati@gmail.com"
              class="social-links"
              title="Link to contact per email"
            >
              <i class="fa-regular fa-envelope fa-xl"></i>
            </a>
          </div>
          <div class="col-4">
            <a
              href="https://www.instagram.com"
              target="_blank"
              class="social-links"
              title="Link to instagram"
              ><i class="fa-brands fa-instagram fa-xl"></i
            ></a>
          </div>
          <div class="col-4">
            <a
              href="https://www.facebook.com"
              target="_blank"
              class="social-links"
              title="Link to facebook"
              ><i class="fa-brands fa-facebook fa-xl"></i
            ></a>
          </div>
        </div>
      </div>
      <p class="github-footer">
        This project was coded by Laura Rahmati and open-sourced on
        <a
          href="https://github.com/Laux0/responsive-project-travel"
          class="github-link"
          target="_blank"
          title="Link to Github account"
          >Github</a
        >
      </p>
    </footer>
  </body>
</html>
