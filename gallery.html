<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="/style/style.css" />
  </head>
  <body>
    <div class="introduction">
      <h1>Photo Gallery</h1>
    </div>
    <div class="gallery-content">
      <div class="row">
        <div class="col-12">
          <h3>Thailand</h3>
        </div>
      </div>
      <div class="row">
        <div class="col-sm-4">
          <img src="/images/Thailand1.png" class="img-fluid" />
        </div>
        <div class="col-sm-4">
          <img src="/images/Thailand2.png" class="img-fluid" />
        </div>
        <div class="col-sm-4">
          <img src="/images/Thailand3.png" class="img-fluid" />
        </div>
      </div>
      <div class="row">
        <div class="col-12">
          <h3>Slovenia</h3>
        </div>
      </div>
      <div class="row">
        <div class="col-sm-4">
          <img src="/images/Slovenia1.png" class="img-fluid" />
        </div>
        <div class="col-sm-4">
          <img src="/images/Slovenia2.png" class="img-fluid" />
        </div>
        <div class="col-sm-4">
          <img src="/images/Slovenia3.png" class="img-fluid" />
        </div>
      </div>
      <div class="row">
        <div class="col-12">
          <h3>Germany</h3>
        </div>
      </div>
      <div class="row">
        <div class="col-sm-4">
          <img src="/images/Germany1.png" class="img-fluid" />
        </div>
        <div class="col-sm-4">
          <img src="/images/Germany2.png" class="img-fluid" />
        </div>
        <div class="col-sm-4">
          <img src="/images/Germany3.png" class="img-fluid" />
        </div>
      </div>
    </div>
  </body>
</html>
