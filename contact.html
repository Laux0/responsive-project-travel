    <title>Contact details for travel photographer Laura Rahmati</title>

  <body>
    <div class="navigation">
      <nav class="d-flex justify-content-between">
        <i class="d-none d-sm-block fa-solid fa-earth-europe fa-2xl mt-3"></i>
        <ul>
          <li><a href="/" title="Link to homepage">Home</a></li>
          <li><a href="/about.html" title="Link to about page">About</a></li>
          <li>
            <a href="/gallery.html" title="Link to gallery page">Gallery</a>
          </li>
          <li>
            <a href="/contact.html" class="active" title="Link to contact page"
              >Contact</a
            >
          </li>
        </ul>
      </nav>
    </div>
    <div class="introduction">
      <h1>Contact Me</h1>
    </div>
    <div class="container contact-content">
      <ul>
        <li class="contact-method">
          Email me at:
          <br />
          <a
            href="mailto:laura.rahmati@gmail.com"
            class="contact-link d-none d-md-block"
            title="Link to contact per email"
            >laura.rahmati@gmail.com</a
          >
          <a
            href="mailto:laura.rahmati@gmail.com"
            class="d-block d-md-none"
            title="Link to contact per email"
            ><i class="fa-regular fa-envelope fa-xl social-links"></i
          ></a>
        </li>
        <li class="contact-method">
          View my photos on:
          <br />
          <a
            href="https://www.instagram.com"
            target="_blank"
            class="contact-link"
            title="Link to instagram"
            >Instagram</a
          >
        </li>
        <li class="contact-method">
          Contact me on:
          <br />
          <a
            href="https://www.facebook.com"
            target="_blank"
            class="contact-link"
            title="Link to facebook"
            >Facebook</a
          >
        </li>
      </ul>
    </div>
    <footer>
      <div class="navigation">
        <div class="row">
          <div class="col-12">
            <p>Contact me at:</p>
            <a
              href="mailto:laura.rahmati@gmail.com"
              class="email-link"
              title="Link to contact per email"
              ><strong>laura.rahmati@gmail.com</strong></a
            >
          </div>
        </div>
        <br />
        <div class="row">
          <div class="col-4">
            <a
              href="mailto:laura.rahmati@gmail.com"
              class="social-links"
              title="Link to contact per email"
            >
              <i class="fa-regular fa-envelope fa-xl"></i>
            </a>
          </div>
          <div class="col-4">
            <a
              href="https://www.instagram.com"
              target="_blank"
              class="social-links"
              title="Link to instagram"
              ><i class="fa-brands fa-instagram fa-xl"></i
            ></a>
          </div>
          <div class="col-4">
            <a
              href="https://www.facebook.com"
              target="_blank"
              class="social-links"
              title="Link to facebook"
              ><i class="fa-brands fa-facebook fa-xl"></i
            ></a>
          </div>
        </div>

      <p class="github-footer">
        This project was coded by Laura Rahmati and open-sourced on
        <a
          href="https://github.com/Laux0/responsive-project-travel"
          class="github-link"
          target="_blank"
          title="Link to Github account"
          >Github</a
        >
      </p>
